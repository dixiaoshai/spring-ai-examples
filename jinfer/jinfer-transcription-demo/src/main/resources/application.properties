spring.application.name=jinfer-transcription-demo

# 设置模型才会启用 jinfer 的 TranscriptionModel Bean。
# 模型引用在首次启动时下载一次并缓存
#（macOS 上为 ~/Library/Caches/jinfer，Linux 上为 ~/.cache/jinfer，或 $JINFER_MODELS）。
# https://huggingface.co/mudler/parakeet-cpp-gguf 中的其他 checkpoint：
#   mudler/parakeet-cpp-gguf/tdt-0.6b-v3-q4_k.gguf     - 多语言，最快
#   mudler/parakeet-cpp-gguf/tdt-0.6b-v2-q8_0.gguf     - 仅英语
#   mudler/parakeet-cpp-gguf/tdt_ctc-110m-q8_0.gguf    - 仅英语，体积小且非常快
spring.ai.jinfer.transcription.model=${JINFER_TRANSCRIPTION_MODEL:mudler/parakeet-cpp-gguf/tdt-0.6b-v3-q8_0.gguf}

# 音频上传文件比 Spring Boot 默认的 1MB multipart 限制更大。
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
