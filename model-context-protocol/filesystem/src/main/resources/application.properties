spring.application.name=mcp
spring.main.web-application-type=none

spring.ai.openai.api-key=${OPENAI_API_KEY}

# ==============================================================================
# MCP 文件系统客户端配置
# ==============================================================================
#
# 本示例支持两种配置方式：
#
# 1. 编程式配置（默认 - 推荐）
#    ------------------------------------------------
#    如果下方未启用 JSON 配置，Application.java 会以编程方式
#    创建 MCP 客户端，并自动检测操作系统：
#      - Windows：使用 cmd.exe /c npx（执行批处理文件所必需）
#      - Linux/Mac：直接使用 npx
#
#    优点：开箱即用，支持所有平台，无需配置文件
#    缺点：硬编码在 Java 中，灵活性较差
#
# 2. JSON 配置（可选）
#    -----------------------------
#    取消注释以下任意一项即可使用基于 JSON 的配置。
#    启用后，Spring Boot 自动配置会从 JSON 文件加载 MCP 客户端，
#    并禁用编程式方式。
#
#    Windows（需要 cmd.exe 包装器）：
#    spring.ai.mcp.client.stdio.servers-configuration=classpath:/mcp-servers-config-windows.json
#
#    Linux/Mac（直接执行 npx）：
#    spring.ai.mcp.client.stdio.servers-configuration=classpath:/mcp-servers-config-linux.json
#
#    优点：配置灵活，可外部化
#    缺点：必须选择正确的操作系统专用 JSON 文件
#
# ==============================================================================
# 重要：不要同时启用两种方式！
# ==============================================================================
# 如果启用了 JSON 配置，编程式的 @Bean 会通过
# @ConditionalOnMissingBean 跳过，以避免重复创建客户端。
# ==============================================================================