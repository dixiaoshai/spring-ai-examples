spring.application.name=prompt-engineering
spring.main.web-application-type=none

# 1. 首先选择一个模型。例如 Anthropic Claude、OpenAI 等。

# 2. 选定模型后，需要确定模型配置。
# 大多数 LLM 都提供多种配置选项来控制 LLM 的输出。

# 2.1 选择提供方的具体模型，并设置连接和访问选项
# spring.ai.anthropic.chat.model=claude-3-7-sonnet-latest
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
#spring.ai.openai.api-key=${OPENAI_API_KEY}

# 2.2 输出长度控制响应中生成的 token 数量。
spring.ai.anthropic.chat.max-tokens=500

# 2.3 采样控制模型输出的随机性。

# 2.3.1 Temperature（温度）
# Temperature 控制 token 选择的随机程度。
# 较低的温度适合期望更确定响应的提示词，
# 而较高的温度会带来更多样或意外的结果。
spring.ai.anthropic.chat.temperature=0.7

# 2.3.2 Top-K 与 top-P
# 在 top-K 和 top-P 之间选择的最佳方式是同时试验两种方法
#（或两者组合），看哪种能产生你想要的结果。

# Top-K
# 从模型预测的分布中选择最可能的 K 个 token。
# top-K 越高，模型输出越有创意、越多样；
# top-K 越低，模型输出越保守、越符合事实。
#spring.ai.anthropic.chat.top-k=

# Top-P
# 选择累积概率不超过某个值（P）的最高概率 token。
# P 的取值范围从 0（贪心解码）到 1（LLM 词表中的所有 token）。
#spring.ai.anthropic.chat.top-p=1.0

# ...
#spring.ai.anthropic.chat.stop-sequences=



